name: Employer source links
on:
  workflow_dispatch:
  schedule:
    - cron: '40 23 * * 0' # Monday 08:40 Asia/Tokyo
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check employer source URLs are alive
        run: node scripts/audit-employer-links.mjs 2>&1 | tee employer-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employer-link-audit
          path: employer-audit.log
          retention-days: 30
