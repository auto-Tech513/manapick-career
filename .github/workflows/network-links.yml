name: Four-site links
on:
  workflow_dispatch:
  schedule:
    - cron: '40 23 * * 6' # Sunday 08:40 Asia/Tokyo
permissions:
  contents: read
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check career job and qualification references
        run: python3 scripts/audit-career-evidence.py
      - name: Check four-site links
        if: always()
        run: python3 scripts/audit-network.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-site-link-evidence
          path: |
            work/career-evidence-audit.json
            work/network-audit/*.json
            work/network-audit/*.csv
          retention-days: 30
