name: IndexNow submit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  checks: read
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for the Cloudflare Pages check to succeed
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '[.check_runs[] | select(.name=="Cloudflare Pages")] | sort_by(.started_at) | last | .conclusion // "pending"')
            echo "attempt $i: $conclusion"
            if [ "$conclusion" = "success" ]; then exit 0; fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then echo "deploy check did not succeed"; exit 1; fi
            sleep 30
          done
          echo "timed out waiting for the Cloudflare Pages check"
          exit 1
      - name: Submit the live sitemap to IndexNow
        run: node scripts/indexnow-submit.mjs
